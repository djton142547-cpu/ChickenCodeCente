
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080304">
<title>VAIPERX Chicken Code Center</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #070304;
  color: #fff;
  font-family: Arial, "Noto Sans Thai", Tahoma, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.page {
  width: min(100%, 1024px);
  padding: 0;
  position: relative;
}

.poster-wrap {
  position: relative;
  width: 100%;
  line-height: 0;
  overflow: hidden;
  background: #090405;
}

.poster {
  display: block;
  width: 100%;
  height: auto;
  user-select: none;
  -webkit-user-drag: none;
}

/* ปุ่มโปร่งใสวางทับบนตำแหน่งปุ่มในรูป */
.hit {
  position: absolute;
  display: block;
  border: 0;
  background: transparent;
  padding: 0;
  margin: 0;
  cursor: pointer;
  z-index: 2;
  border-radius: 9px;
  color: transparent;
  line-height: normal;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}

.hit:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 1px;
  background: #ffffff12;
}

.hit:hover {
  background: #ffffff08;
}

/* คัดลอกลิงก์ลงไก่โค้ด */
#copy-link {
  left: 54.7%;
  top: 35.5%;
  width: 18.3%;
  height: 3.55%;
}

/* เปิดลิงก์ลงไก่โค้ด */
#open-link {
  left: 74.5%;
  top: 35.5%;
  width: 16.5%;
  height: 3.55%;
}

/* คัดลอก IP */
#copy-ip {
  left: 54.7%;
  top: 47%;
  width: 19.2%;
  height: 3.6%;
}

/* คัดลอก PORT */
#copy-port {
  left: 54.7%;
  top: 58.6%;
  width: 19.8%;
  height: 3.6%;
}

/* คัดลอก IP และ PORT พร้อมกัน */
#copy-ipport {
  left: 55.2%;
  top: 70.2%;
  width: 23%;
  height: 3.7%;
}

/* เปิด App Store */
#open-app {
  left: 9.2%;
  top: 83%;
  width: 37%;
  height: 3.6%;
}

/* ปุ่มคลิปสอน */
#open-tutorial {
  left: 53.3%;
  top: 83%;
  width: 27%;
  height: 3.6%;
}

/* แจ้งเตือนเมื่อกดคัดลอก */
.toast {
  position: fixed;
  left: 50%;
  bottom: max(20px, env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  z-index: 10;
  background: #151014;
  border: 1px solid #ff3345;
  border-radius: 12px;
  padding: 12px 17px;
  font-size: 14px;
  line-height: 1.4;
  box-shadow: 0 0 25px #ff001c55;
  max-width: calc(100vw - 28px);
  text-align: center;
  transition: opacity .2s, transform .2s;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (min-width: 700px) {
  .poster-wrap {
    box-shadow: 0 0 50px #ff001c22;
  }
}
</style>
</head>

<body>
<main class="page">

  <div class="poster-wrap">

    <!-- รูปโปสเตอร์หลัก -->
    <img
      class="poster"
      src="https://i.postimg.cc/mDcQCztv/po-s-te-xr-VAIPERX-s-ny-rwm-kho-dki-neon.png"
      alt="VAIPERX Chicken Code Center"
      draggable="false"
    >

    <!-- ปุ่มคัดลอกลิงก์ -->
    <button
      class="hit"
      id="copy-link"
      aria-label="คัดลอกลิงก์ลงไก่โค้ด"
      title="คัดลอกลิงก์"
    >คัดลอกลิงก์</button>

    <!-- ปุ่มเปิดเว็บไซต์ -->
    <a
      class="hit"
      id="open-link"
      href="http://82.26.104.35:6071/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="เปิดลิงก์ลงไก่โค้ด"
      title="เปิดลิงก์"
    >เปิดลิงก์</a>

    <!-- ปุ่มคัดลอก IP -->
    <button
      class="hit"
      id="copy-ip"
      aria-label="คัดลอก IP"
      title="คัดลอก IP"
    >คัดลอก IP</button>

    <!-- ปุ่มคัดลอก PORT -->
    <button
      class="hit"
      id="copy-port"
      aria-label="คัดลอก PORT"
      title="คัดลอก PORT"
    >คัดลอก PORT</button>

    <!-- ปุ่มคัดลอก IP:PORT -->
    <button
      class="hit"
      id="copy-ipport"
      aria-label="คัดลอก IP และ PORT"
      title="คัดลอก IP:PORT"
    >คัดลอกทั้งหมด</button>

    <!-- ปุ่มดาวน์โหลดแอป ProxyPin -->
    <a
      class="hit"
      id="open-app"
      href="https://apps.apple.com/th/app/proxypin-%E0%B8%88-%E0%B8%9A%E0%B8%97%E0%B8%A3%E0%B8%B2%E0%B8%9F%E0%B8%9F-%E0%B8%81-http-s/id6450932949?l=th"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="เปิดหน้า ProxyPin ใน App Store"
      title="ดาวน์โหลดแอป"
    >ดาวน์โหลดแอป</a>

    <!-- ปุ่มคลิปสอนใช้งาน -->
    <button
      class="hit"
      id="open-tutorial"
      aria-label="คลิปสอนใช้งาน"
      title="เพิ่มลิงก์คลิปสอนภายหลัง"
    >คลิปสอนใช้งาน</button>

  </div>
</main>

<!-- กล่องแจ้งเตือน -->
<div
  class="toast"
  id="toast"
  role="status"
  aria-live="polite"
></div>

<script>
/* ข้อมูลสำหรับปุ่มคัดลอก */
const COPY_VALUES = {
  "copy-link": "http://82.26.104.35:6071/",
  "copy-ip": "IP : 82.26.104.35",
  "copy-port": "9999",
  "copy-ipport": "82.26.104.35:8080"
};

let toastTimer;

/* แสดงข้อความแจ้งเตือน */
function showToast(message) {
  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    el.classList.remove("show");
  }, 2400);
}

/* ฟังก์ชันคัดลอกข้อความ */
async function copyText(value) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(value);
    } else {
      const field = document.createElement("textarea");

      field.value = value;
      field.setAttribute("readonly", "");

      field.style.position = "fixed";
      field.style.opacity = "0";

      document.body.appendChild(field);
      field.select();

      const success = document.execCommand("copy");

      field.remove();

      if (!success) {
        throw new Error("copy failed");
      }
    }

    showToast("คัดลอกแล้ว: " + value);

  } catch (error) {
    showToast(
      "คัดลอกไม่สำเร็จ กรุณาลองเปิดเว็บผ่าน HTTPS"
    );
  }
}

/* เชื่อมปุ่มคัดลอกทั้งหมด */
Object.entries(COPY_VALUES).forEach(([id, value]) => {
  document.getElementById(id).addEventListener("click", () => {
    copyText(value);
  });
});

/* ปุ่มคลิปสอน: รอใส่ลิงก์จริง */
document.getElementById("open-tutorial").addEventListener("click", () => {
  showToast("ส่งลิงก์คลิปสอนมาได้เลย แล้วจะใส่ให้ปุ่มนี้");
});
</script>

</body>
</html>
